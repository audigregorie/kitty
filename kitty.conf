### testing

# Place tab bar at the bottom
tab_bar_edge bottom

# Minimal look — no excessive borders/padding
tab_bar_style powerline
tab_powerline_style round

# Reduce tab spacing
tab_bar_margin_width 0
tab_bar_margin_height 0

# Colors for active/inactive tabs
active_tab_foreground   #1e1e2e
active_tab_background   #FF9F43
inactive_tab_foreground #a6adc8
inactive_tab_background #313244

# No fancy separator symbol if you want it minimal
tab_separator ""

# Optional — hide close button for a cleaner look
tab_activity_symbol none

