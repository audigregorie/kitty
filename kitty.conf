# Kitty Conf

## Window configuration
# foreground                    #ddd
background                    #131313
term                          xterm-kitty
window_padding_width          15
window_padding_height         5
hide_window_decorations       titlebar-only
window_border_width           0
# background_opacity            0.98
# Default to vertical split
enabled_layouts splits:split_axis=horizontal


## Font configuration
font_family                   JetBrains NF
font_size                     11.5
# text_composition_strategy     legacy
text_composition_strategy     platform
adjust_line_height            8
adjust_column_width           0
font_hinting                  none
font_antialias                true
allow_bold                    no


## Tab configuration
# Show tab bar only when needed
tab_bar_min_tabs 2
# Background color for tab bar
tab_bar_background #1e1e1e
# Margin around tab bar
tab_bar_margin 0 0 1px 0
# Separator between tabs
tab_bar_separator #333333
# Color of tabs
active_tab_foreground     #e8e8e8
active_tab_background     #2d2d2d
active_tab_border         #4a4a4a 0.5
inactive_tab_foreground   #a0a0a0
inactive_tab_background   #1e1e1e
inactive_tab_border       #1e1e1e 0.5


## Tab management
map cmd+right next_tab
map cmd+left previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9


## Cursor configuration
cursor_blink_interval         0
cursor_shape                  block

## Other configurations
# Clickable links
allow_hyperlinks yes
# Number of lines of history to keep in memory for scrolling back
scrollback_lines 10000
# Decreasing it, increases frames-per-second (FPS) at the cost of more CPU usage
repaint_delay 6
# Increase responsiveness, but also increase CPU usage
input_delay 2


## Keybindings
# ctrl+shift+n -> new kitty window
kitty_mod ctrl+cmd
# Rename tab
map kitty_mod+, set_tab_title
# Vertical split
map kitty_mod+v launch --location=vsplit --cwd=current
# Previous split
map kitty_mod+h previous_window
# Next split
map kitty_mod+l next_window
# Close current split
map kitty_mod+x close_window
# Resize pane (decrease)
map ctrl+left  resize_window narrower
# Resize pane (increase)
map ctrl+right resize_window wider
# Switch to previously active tab
map kitty_mod+m goto_tab -1




